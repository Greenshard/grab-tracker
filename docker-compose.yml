# grab-tracker — live map for a Grab share-location link (grab.pshard.com).
#
# Open https://grab.pshard.com/o/<token>, where <token> is the last segment of
# a sharelocation.grab.com/o/... link. Short links work the same way:
# app.grab.com/s/<code> becomes grab.pshard.com/s/<code>. Or open the root and
# paste either link.
#
# api.grab.com refuses browser requests from any origin except Grab's own
# share page, so server.ts proxies that one endpoint for index.html.
#
# No build step: the source directory is mounted read-only. index.html is read
# per request, so a git pull updates it live; a server.ts change needs
# `docker compose restart`.

services:
  grab-tracker:
    image: oven/bun:1.3.13-alpine
    container_name: grab-tracker
    restart: unless-stopped
    dns:
      - 192.168.0.200
    working_dir: /app
    command: ["bun", "server.ts"]

    # Bound to loopback only; Caddy is the only ingress.
    ports:
      - "127.0.0.1:3460:3471"

    # Directory mount, not single files: git pull replaces files atomically,
    # which would strand single-file mounts on the old inode.
    volumes:
      - ./:/app:ro

    environment:
      HOST: 0.0.0.0
      PORT: "3471"

    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3471/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
